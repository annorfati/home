<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  background: #262028;
  color: #554A59;
  font-family: Commit Mono, monospace;

  margin: 0;
  padding: 20px;

  min-height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-weight: 100;
  letter-spacing: 6px;
  font-size: 22px;

  opacity: 0;
  animation: fadeIn 2s forwards;
}

@keyframes fadeIn {

  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }

}

@keyframes fadeInCaption {

  from {
    opacity: 0;
  }

  to {
    opacity: 0.75;
  }

}

.subtitle {

  opacity: 0;

  font-size: 13px;

  letter-spacing: 2px;

  color: #9B8DA0;

  animation: fadeIn 2s forwards;

  animation-delay: 1s;
}
  
.heart {
  display: inline-block;
  overflow: hidden;
  white-space: nowrap;
  width: 0;

  animation: typing 3.5s steps(11, end) forwards;
  animation-delay: 3s;
}

.rest {
  opacity: 0;
  animation: fadeIn 2.5s ease forwards;
  animation-delay: 8s;
}
  
@keyframes typing {
  from {
    width: 0;
  }
  to {
    width: 11ch;
  }
}
  
.highlight {
  color: #C7BFCA;
}

.glow {
  display: inline-block;
  animation: glow 4s ease-in-out infinite;
}

@keyframes glow {

    0%,100%{
        color:#C7BFCA;
        text-shadow:
            0 0 2px rgba(199,191,202,.18),
            0 0 5px rgba(199,191,202,.10);
    }

    50%{
        color:#E4DDEA;
        text-shadow:
            0 0 8px rgba(228,221,234,.45),
            0 0 18px rgba(199,191,202,.25);
    }

}

.content {

  max-width: 700px;

  margin: 100px auto;

  text-align: left;

  line-height: 1.8;
}
  
.back-link {
  position: fixed;
  left: 40px;
  bottom: 40px;

  color: #9B8DA0;
  text-decoration: none;
  letter-spacing: 3px;
  transition: opacity 0.3s ease;
}

.home-link {
  display: block;
  text-align: center;
  margin-top: 50px;

  color: #9B8DA0;
  text-decoration: none;
  letter-spacing: 3px;
  transition: opacity 0.3s ease;
}

.back-link:hover,
.home-link:hover {
  opacity: 0.6;
}
  
footer {

  margin-top: 100px;

  font-size: 11px;

  opacity: 0.5;

  letter-spacing: 2px;
}
  
.content {
  overflow-wrap: break-word;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

.artwork {
  opacity: 0;
  transform: scale(0.97);

  animation: reveal 4s ease forwards;
  animation-delay: 3.2s;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  margin: 70px auto 0;
}

.art-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.art-caption {
  margin-top: 18px;

  color: #C7BFCA;
  opacity: 0;

  font-size: 16px;
  letter-spacing: 1.5px;
  text-align: center;

  animation: fadeInCaption 2s ease forwards;
  animation-delay: 7.2s;
}
  
@keyframes reveal {

  from {
    opacity: 0;
    transform: scale(0.97);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

.artwork {
  max-width: 95vw;
  max-height: 85vh;
}

  h1 {
    font-size: 20px;
    letter-spacing: 4px;
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 1.5px;
  }

  .content {
    margin: 50px auto;
    line-height: 1.7;
  }

  .back-link {
    left: 20px;
    bottom: 20px;
    font-size: 13px;
  }

  .home-link {
    margin-top: 40px;
    font-size: 13px;
  }

  footer {
    margin-top: 60px;
    font-size: 10px;
  }

}
  
</style>

</head>

<body>

<h1>billets doux </h1>

<p class="subtitle">
  02, [REDACTED]
</p>

<div class="artwork-container">
  
  <img
    src="pale nightshade.jpeg"
    alt="pale nightshade"
    class="artwork">

  <p class="art-caption">
        <span class="highlight glow">Pale Nightshade</span>, 2026
    </p>
  
</div>

<a class="back-link" href="billets-doux.html">
  ← 01
</a>

<a class="home-link" href="index.html">
  home
</a>


<footer>
  ongoing website, 2026-
</footer>

</body>
</html>
